<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドボン共済</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 通帳っぽい1カラム。いちばん上に積立総額、その下に二人の内訳、さらに下に1回ごとの記帳 */
:root {
  --bg: #eef2f0;
  --paper: #ffffff;
  --ink: #17221d;
  --muted: #5f6f67;
  --line: #d3ddd8;
  --ken: #2563c9;
  --ken-soft: #e3ecfb;
  --ara: #d9480f;
  --ara-soft: #fde8de;
  --accent: #0f7a52;
  --danger: #b42318;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --paper: #18211d; --ink: #e8efeb; --muted: #9aaba2; --line: #2b3832;
    --ken: #7aa7ff; --ken-soft: #1c2a45; --ara: #ff8a5c; --ara-soft: #3d2219; --accent: #4cc794; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --paper: #18211d; --ink: #e8efeb; --muted: #9aaba2; --line: #2b3832;
  --ken: #7aa7ff; --ken-soft: #1c2a45; --ara: #ff8a5c; --ara-soft: #3d2219; --accent: #4cc794; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.tabs { display: flex; gap: 8px; }
.tab { flex: 1; text-align: center; padding: 10px 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-family: var(--mono); font-size: 14px; cursor: pointer; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.total { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.total .amount { font-family: var(--mono); font-weight: 700; font-size: clamp(36px, 11vw, 54px); line-height: 1; font-variant-numeric: tabular-nums; }
.total .amount small { font-family: var(--body); font-size: 18px; margin-left: 4px; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who { border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.who.ken { background: var(--ken-soft); color: var(--ken); }
.who.aratyan { background: var(--ara-soft); color: var(--ara); }
.who .name { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.who .sum { font-family: var(--mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.who .cnt { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 999px; overflow: hidden; display: flex; background: var(--line); }
.bar span { display: block; height: 100%; }
.ledger { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ledger h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .date { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { justify-self: start; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chip.ken { background: var(--ken-soft); color: var(--ken); }
.chip.aratyan { background: var(--ara-soft); color: var(--ara); }
.row .yen { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.empty { padding: 22px 14px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.carousel { overflow: hidden; touch-action: pan-y; }
.track { display: flex; align-items: flex-start; }
.track.animate { transition: transform .3s cubic-bezier(.22,.61,.36,1); }
.panel { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">DOBON MUTUAL AID</div>
    <h1>ドボン共済</h1>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="carousel" id="carousel">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
// シーズンごとに記帳をまとめる。who は "ken" か "aratyan"、amount は円。
// 新しいシーズンを増やすときは SEASONS に { name, entries: [...] } を足す。デフォルトは最新シーズン。
const SEASONS = [
  {
    name: "シーズン1",
    entries: [
      { date: "2026-11-06", who: "ken", amount: 2800 },
      { date: "2026-11-06", who: "aratyan", amount: 3200 },
      { date: "2026-11-06", who: "ken", amount: 4800 },
      { date: "2026-11-06", who: "ken", amount: 8800 },
      { date: "2026-11-06", who: "ken", amount: 4000 },
      { date: "2026-11-06", who: "aratyan", amount: 1600 },
      { date: "2026-11-06", who: "aratyan", amount: 8000 },
      { date: "2026-11-06", who: "aratyan", amount: 8000 },
      { date: "2026-11-06", who: "aratyan", amount: 8800 },
      { date: "2026-11-08", who: "aratyan", amount: 2000 },
      { date: "2026-11-08", who: "ken", amount: 8000 },
      { date: "2026-11-09", who: "ken", amount: 10000 },
      { date: "2026-11-09", who: "aratyan", amount: 4000 },
      { date: "2026-11-09", who: "aratyan", amount: 6000 },
      { date: "2026-11-13", who: "ken", amount: 6400 },
      { date: "2026-11-13", who: "ken", amount: 3600 },
      { date: "2026-11-13", who: "aratyan", amount: 8000 },
      { date: "2026-11-13", who: "aratyan", amount: 2000 },
      { date: "2026-11-14", who: "aratyan", amount: 2000 },
      { date: "2026-11-14", who: "ken", amount: 8000 },
      { date: "2026-11-15", who: "ken", amount: 10000 },
      { date: "2026-11-15", who: "ken", amount: 1200 },
      { date: "2026-11-15", who: "ken", amount: 7200 },
      { date: "2026-11-15", who: "ken", amount: 1600 },
      { date: "2026-11-18", who: "ken", amount: 7200 },
      { date: "2026-11-18", who: "ken", amount: 1600 },
      { date: "2026-11-18", who: "aratyan", amount: 8400 },
      { date: "2026-11-18", who: "ken", amount: 2800 },
      { date: "2026-11-18", who: "ken", amount: 20000 },
      { date: "2026-11-19", who: "ken", amount: 40000 },
      { date: "2026-11-23", who: "aratyan", amount: 4400 },
      { date: "2026-11-23", who: "ken", amount: 3600 },
      { date: "2026-11-23", who: "aratyan", amount: 3600 },
      { date: "2026-11-23", who: "ken", amount: 3600 },
      { date: "2026-11-23", who: "aratyan", amount: 2800 },
      { date: "2026-11-23", who: "aratyan", amount: 2000 },
      { date: "2026-11-23", who: "ken", amount: 4800 },
      { date: "2026-11-23", who: "aratyan", amount: 15200 },
      { date: "2026-11-23", who: "ken", amount: 4400 },
      { date: "2026-11-23", who: "ken", amount: 4800 },
      { date: "2026-11-23", who: "aratyan", amount: 10800 },
      { date: "2026-11-24", who: "aratyan", amount: 20000 },
      { date: "2026-11-24", who: "aratyan", amount: 10000 },
      { date: "2026-11-24", who: "aratyan", amount: 20000 },
      { date: "2026-11-24", who: "aratyan", amount: 20000 },
      { date: "2026-11-24", who: "ken", amount: 18400 },
      { date: "2026-11-24", who: "aratyan", amount: 41600 },
      // 2026-11-25（昨日の結果・負け額を集約。共済に入れるのは「負けた額」）
      { date: "2026-11-25", who: "ken", amount: 120800 },
      { date: "2026-11-25", who: "aratyan", amount: 228000 },
    ],
  },
  {
    name: "シーズン2",
    entries: [],
  },
  {
    name: "シーズンB",
    special: true, // 特殊系。タブ/スワイプでは出すが、初期表示のデフォルトにはしない
    entries: [],
  },
];

const $ = (id) => document.getElementById(id);
const yen = (n) => n.toLocaleString("ja-JP") + "円";
// デフォルトは最新の「通常」シーズン（special=特殊系は初期表示にしない）
let active = (() => {
  for (let i = SEASONS.length - 1; i >= 0; i--) if (!SEASONS[i].special) return i;
  return SEASONS.length - 1;
})();

const carousel = $("carousel");
const track = $("track");

// シーズン1枚分のパネルを作る
function buildPanel(season) {
  const rows = season.entries.map((r, i) => ({ ...r, i }));
  const ken = rows.filter((r) => r.who === "ken");
  const ara = rows.filter((r) => r.who === "aratyan");
  const sk = ken.reduce((s, r) => s + r.amount, 0);
  const sa = ara.reduce((s, r) => s + r.amount, 0);
  const total = sk + sa;
  const pk = total ? (sk / total) * 100 : 50;
  const panel = document.createElement("div");
  panel.className = "panel";
  const totalSec = document.createElement("section");
  totalSec.className = "total";
  totalSec.setAttribute("aria-label", "積立の合計");
  totalSec.innerHTML =
    '<div class="eyebrow">積立総額</div>' +
    '<div class="amount"><span>' + total.toLocaleString("ja-JP") + '</span><small>円</small></div>' +
    '<div class="bar" aria-hidden="true"><span style="background:var(--ken);width:' + pk + '%"></span><span style="background:var(--ara);width:' + (100 - pk) + '%"></span></div>' +
    '<div class="split">' +
      '<div class="who ken"><span class="name">ken</span><span class="sum">' + yen(sk) + '</span><span class="cnt">' + ken.length + '回</span></div>' +
      '<div class="who aratyan"><span class="name">aratyan</span><span class="sum">' + yen(sa) + '</span><span class="cnt">' + ara.length + '回</span></div>' +
    '</div>';
  const ledger = document.createElement("section");
  ledger.className = "ledger";
  ledger.setAttribute("aria-label", "記帳の一覧");
  const h2 = document.createElement("h2"); h2.textContent = "記帳（新しい順）";
  const list = document.createElement("div");
  ledger.append(h2, list);
  if (!rows.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "まだ記帳がありません。"; list.appendChild(e);
  } else {
    rows.sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i);
    for (const r of rows) {
      const row = document.createElement("div"); row.className = "row";
      const d = document.createElement("span"); d.className = "date"; d.textContent = r.date.replace(/-/g, "/");
      const c = document.createElement("span"); c.className = "chip " + r.who; c.textContent = r.who;
      const y = document.createElement("span"); y.className = "yen"; y.textContent = yen(r.amount);
      row.append(d, c, y); list.appendChild(row);
    }
  }
  panel.append(totalSec, ledger);
  return panel;
}

function buildTrack() {
  track.textContent = "";
  SEASONS.forEach((s) => track.appendChild(buildPanel(s)));
}

function layout(animate) {
  track.classList.toggle("animate", !!animate);
  track.style.transform = "translateX(" + (-active * carousel.clientWidth) + "px)";
}

function buildTabs() {
  const tabs = $("tabs");
  tabs.textContent = "";
  SEASONS.forEach((s, idx) => {
    const b = document.createElement("button");
    b.className = "tab" + (idx === active ? " active" : "");
    b.textContent = s.name;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => go(idx));
    tabs.appendChild(b);
  });
}

function go(idx, animate = true) {
  active = Math.max(0, Math.min(SEASONS.length - 1, idx));
  layout(animate);
  buildTabs();
}

// 指でスライド → シーズンごとにスナップ
let startX = 0, startY = 0, dx = 0, W = 0, dragging = false, decided = false, horiz = false;
carousel.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; dx = 0; W = carousel.clientWidth;
  dragging = true; decided = false; horiz = false;
  track.classList.remove("animate");
}, { passive: true });
carousel.addEventListener("touchmove", (e) => {
  if (!dragging) return;
  const t = e.touches[0];
  const mx = t.clientX - startX, my = t.clientY - startY;
  if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { decided = true; horiz = Math.abs(mx) > Math.abs(my); }
  if (!horiz) return;
  dx = mx;
  // 端でははみ出しに抵抗をかける
  if ((active === 0 && dx > 0) || (active === SEASONS.length - 1 && dx < 0)) dx *= 0.35;
  track.style.transform = "translateX(" + (-active * W + dx) + "px)";
}, { passive: true });
carousel.addEventListener("touchend", () => {
  if (!dragging) return;
  dragging = false;
  const threshold = Math.min(70, W * 0.18);
  if (horiz && dx < -threshold && active < SEASONS.length - 1) active++;
  else if (horiz && dx > threshold && active > 0) active--;
  layout(true);
  buildTabs();
}, { passive: true });

window.addEventListener("resize", () => layout(false));

buildTrack();
buildTabs();
layout(false);
</script>
</body>
</html>
