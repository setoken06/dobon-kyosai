<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドボン共済</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 通帳っぽい1カラム。いちばん上に積立総額、その下に二人の内訳、さらに下に1回ごとの記帳 */
:root {
  --bg: #eef2f0;
  --paper: #ffffff;
  --ink: #17221d;
  --muted: #5f6f67;
  --line: #d3ddd8;
  --ken: #2563c9;
  --ken-soft: #e3ecfb;
  --ara: #d9480f;
  --ara-soft: #fde8de;
  --accent: #0f7a52;
  --danger: #b42318;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --paper: #18211d; --ink: #e8efeb; --muted: #9aaba2; --line: #2b3832;
    --ken: #7aa7ff; --ken-soft: #1c2a45; --ara: #ff8a5c; --ara-soft: #3d2219; --accent: #4cc794; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --paper: #18211d; --ink: #e8efeb; --muted: #9aaba2; --line: #2b3832;
  --ken: #7aa7ff; --ken-soft: #1c2a45; --ara: #ff8a5c; --ara-soft: #3d2219; --accent: #4cc794; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.total { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.total .amount { font-family: var(--mono); font-weight: 700; font-size: clamp(36px, 11vw, 54px); line-height: 1; font-variant-numeric: tabular-nums; }
.total .amount small { font-family: var(--body); font-size: 18px; margin-left: 4px; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who { border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.who.ken { background: var(--ken-soft); color: var(--ken); }
.who.aratyan { background: var(--ara-soft); color: var(--ara); }
.who .name { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.who .sum { font-family: var(--mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.who .cnt { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 999px; overflow: hidden; display: flex; background: var(--line); }
.bar span { display: block; height: 100%; }
.ledger { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ledger h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .date { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { justify-self: start; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chip.ken { background: var(--ken-soft); color: var(--ken); }
.chip.aratyan { background: var(--ara-soft); color: var(--ara); }
.row .yen { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.empty { padding: 22px 14px; color: var(--muted); font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">DOBON MUTUAL AID</div>
    <h1>ドボン共済</h1>
  </header>

  <section class="total" aria-label="積立の合計">
    <div class="eyebrow">積立総額</div>
    <div class="amount"><span id="total">0</span><small>円</small></div>
    <div class="bar" aria-hidden="true"><span id="barKen" style="background:var(--ken);width:50%"></span><span id="barAra" style="background:var(--ara);width:50%"></span></div>
    <div class="split">
      <div class="who ken"><span class="name">ken</span><span class="sum" id="sumKen">0円</span><span class="cnt" id="cntKen">0回</span></div>
      <div class="who aratyan"><span class="name">aratyan</span><span class="sum" id="sumAra">0円</span><span class="cnt" id="cntAra">0回</span></div>
    </div>
  </section>


  <section class="ledger" aria-label="記帳の一覧">
    <h2>記帳（新しい順）</h2>
    <div id="list"></div>
  </section>
</div>

<script>
// 記帳はここに1行ずつ足していく（新しい順でも古い順でもOK。表示は日付の新しい順）
// who は "ken" か "aratyan"、amount は円
const ENTRIES = [
  // { date: "2026-11-06", who: "ken", amount: 1000 },
  // 2026-11-06 dobon_online 対戦履歴（7戦）。矢印の先（受け取った側）が「入れた」人。古い順
  { date: "2026-11-06", who: "ken", amount: 2800 },
  { date: "2026-11-06", who: "aratyan", amount: 3200 },
  { date: "2026-11-06", who: "ken", amount: 4800 },
  { date: "2026-11-06", who: "ken", amount: 8800 },
  { date: "2026-11-06", who: "ken", amount: 4000 },
  { date: "2026-11-06", who: "aratyan", amount: 1600 },
  { date: "2026-11-06", who: "aratyan", amount: 8000 },
  { date: "2026-11-06", who: "aratyan", amount: 8000 },
  { date: "2026-11-06", who: "aratyan", amount: 8800 },
  { date: "2026-11-08", who: "aratyan", amount: 2000 },
  { date: "2026-11-08", who: "ken", amount: 8000 },
  { date: "2026-11-09", who: "ken", amount: 10000 },
  { date: "2026-11-09", who: "aratyan", amount: 4000 },
  { date: "2026-11-09", who: "aratyan", amount: 6000 },
  { date: "2026-11-13", who: "ken", amount: 6400 },
  { date: "2026-11-13", who: "ken", amount: 3600 },
];

const $ = (id) => document.getElementById(id);
const yen = (n) => n.toLocaleString("ja-JP") + "円";

(function render() {
  const rows = ENTRIES.map((r, i) => ({ ...r, i }));
  const ken = rows.filter((r) => r.who === "ken");
  const ara = rows.filter((r) => r.who === "aratyan");
  const sk = ken.reduce((s, r) => s + r.amount, 0);
  const sa = ara.reduce((s, r) => s + r.amount, 0);
  const total = sk + sa;
  $("total").textContent = total.toLocaleString("ja-JP");
  $("sumKen").textContent = yen(sk);
  $("sumAra").textContent = yen(sa);
  $("cntKen").textContent = ken.length + "回";
  $("cntAra").textContent = ara.length + "回";
  const pk = total ? (sk / total) * 100 : 50;
  $("barKen").style.width = pk + "%";
  $("barAra").style.width = 100 - pk + "%";
  const list = $("list");
  list.textContent = "";
  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "まだ記帳がありません。";
    list.appendChild(e);
    return;
  }
  rows.sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i);
  for (const r of rows) {
    const row = document.createElement("div");
    row.className = "row";
    const d = document.createElement("span"); d.className = "date"; d.textContent = r.date.replace(/-/g, "/");
    const c = document.createElement("span"); c.className = "chip " + r.who; c.textContent = r.who;
    const y = document.createElement("span"); y.className = "yen"; y.textContent = yen(r.amount);
    row.append(d, c, y);
    list.appendChild(row);
  }
})();
</script>
</body>
</html>
